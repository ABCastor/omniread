<svg xmlns="http://www.w3.org/2000/svg" width="112" height="72" viewBox="0 0 112 72" role="img" aria-label="OmniRead reading logo"><title>OmniRead reading logo</title><style> :root{--ink:#14130f;--paper:#faf9f4;--quiet:#77746c;--read:#006770;--badge:#006770;--human:#c4552a}@media(prefers-color-scheme:dark){:root{--ink:#e9e6df;--paper:#0d1117;--quiet:#96938c;--read:#00858f;--badge:#00858f}}.read-line{stroke-dasharray:1;stroke-dashoffset:1;animation:read 8s cubic-bezier(.45,0,.55,1) infinite,colors-a 16s steps(1,end) infinite}.line-2{animation-delay:.55s,0s;animation-name:read,colors-b}.line-3{animation-delay:0s,0s}.line-4{animation-delay:.55s,0s;animation-name:read,colors-b}@keyframes colors-a{0%,100%{stroke:var(--human)}50%{stroke:var(--read)}}@keyframes colors-b{0%,100%{stroke:var(--read)}50%{stroke:var(--human)}}.badge-star,.badge-cutout{transform-origin:12px 12px;animation:turn 8s cubic-bezier(.45,0,.55,1) infinite}@keyframes read{0%,10%{stroke-dashoffset:1;opacity:1}20%,57%{stroke-dashoffset:0;opacity:1}68%,100%{stroke-dashoffset:0;opacity:0}}@keyframes turn{0%,28%,72%,100%{transform:rotate(0deg)}40%,60%{transform:rotate(90deg)}}@media(prefers-reduced-motion:reduce){.read-line,.badge-star,.badge-cutout{animation:none}.read-line{stroke-dashoffset:0;opacity:1}.line-1,.line-3{stroke:var(--human)}.line-2,.line-4{stroke:var(--read)}}</style><g transform="translate(-4 0)"><path d="M12 23C24 19 36 21 48 28C60 21 72 19 84 23V61C72 57 60 59 48 66C36 59 24 57 12 61Z" fill="var(--paper)" stroke="var(--ink)" stroke-width="3.6" stroke-linejoin="round"/><path d="M48 28V65" fill="none" stroke="var(--ink)" stroke-width="2.8"/><g fill="none" stroke-width="2.7" stroke-linecap="round"><path d="M22 33Q31 31 39 36M22 45Q31 43 39 48M57 33Q66 31 74 36M57 45Q66 43 74 48" stroke="var(--quiet)"/><path class="read-line line-1" pathLength="1" d="M22 33Q31 31 39 36" stroke="var(--read)"/><path class="read-line line-2" pathLength="1" d="M22 45Q31 43 39 48" stroke="var(--read)"/><path class="